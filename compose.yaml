services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: local-compose-demo-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://messenger:local-compose-demo-only@db:5432/messenger?sslmode=disable
      HTTP_ADDR: 0.0.0.0:8080
      APP_ORIGIN: http://localhost:${APP_PORT:-8080}
      FRONTEND_DIR: /app/frontend
      DOCKER_LOCAL_DEMO: "true"
      SEED_DEMO: "true"
      DEMO_PASSWORD: LocalDemo-2026!
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
